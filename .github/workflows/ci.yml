name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: threadifi
          POSTGRES_PASSWORD: threadifi_dev
          POSTGRES_DB: threadifi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U threadifi -d threadifi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      DB_USER: threadifi
      DB_PASSWORD: threadifi_dev
      DB_HOST: localhost
      TEST_DB_NAME: threadifi_test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17.3"
          otp-version: "27.1.2"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: assets/package-lock.json

      - name: Install Elixir deps
        run: mix deps.get

      - name: Install asset deps
        run: npm ci --prefix assets

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Credo
        run: mix credo --all

      - name: Prepare test database
        run: |
          mix ecto.create
          mix ecto.migrate

      - name: Run tests
        run: mix test
