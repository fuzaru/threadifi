services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: threadifi
      POSTGRES_PASSWORD: threadifi_dev
      POSTGRES_DB: threadifi_dev
    ports:
      - "5433:5432"
    volumes:
      - threadifi_db:/var/lib/postgresql/data

  app:
    image: elixir:1.17.3-otp-27
    working_dir: /app
    volumes:
      - .:/app
    environment:
      MIX_ENV: dev
      DOCKER: "true"
      DB_HOST: db
      DB_USER: threadifi
      DB_PASSWORD: threadifi_dev
      DB_NAME: threadifi_dev
      PHX_SERVER: "true"
    ports:
      - "4000:4000"
    depends_on:
      - db
    command: >
      bash -lc "apt-get update &&
      apt-get install -y --no-install-recommends inotify-tools watchman &&
      rm -rf /var/lib/apt/lists/* &&
      mix deps.get &&
      mix ecto.create &&
      mix ecto.migrate &&
      mix run priv/repo/seeds.exs &&
      mix phx.server"

volumes:
  threadifi_db:
